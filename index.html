<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Generator</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
<section>
    <h2 class="title">Password Generator</h2>
    <form id="passwordForm">
        <div class="password-container">
            <fieldset>
                <legend>Пароль:</legend>
                <div class="input_box copy">
                    <input type="text" id="result" readonly aria-label="Generated password" />
                    <button type="button" id="copyBtn" class="copy-btn" aria-label="Copy password to clipboard"></button>
                </div>
            </fieldset>
        </div>

        <div class="length-container">
            <fieldset>
                <legend>Длинна пароля:</legend>
                <div class="input_box">
                    <input type="number" id="pass" value="12" min="1" max="128" aria-label="Password length" />
                </div>
            </fieldset>
        </div>

        <fieldset class="options">
            <legend>Выбор символов:</legend>
            <div class="option">
                <input class="checkbox" type="checkbox" id="Up" checked />
                <label for="Up">Uppercase (A...Z)</label>
            </div>
            <div class="option">
                <input class="checkbox" type="checkbox" id="Lw" checked />
                <label for="Lw">Lowercase (a...z)</label>
            </div>
            <div class="option">
                <input class="checkbox" type="checkbox" id="Sp" checked />
                <label for="Sp">Special (!@#$%^&*())</label>
            </div>
            <div class="option">
                <input class="checkbox" type="checkbox" id="Dg" checked />
                <label for="Dg">Digital (0...9)</label>
            </div>
        </fieldset>

        <div class="buttons">
            <button type="button" id="generateBtn" class="btn-default">GENERATE</button>
            <button type="button" id="resetBtn" class="btn-default">RESET</button>
        </div>
    </form>
    <small>v1.2</small>
</section>
<script src="static/main.js"></script>
</body>
</html>
